# =============================================================================
# reversproxy 클라이언트 설정 샘플 — 파일 전송(드롭 폴더 + 우클릭/CLI) 포함
# -----------------------------------------------------------------------------
# 이 파일을 config.yaml 로 복사한 뒤 CHANGE-ME 값을 채워 사용하세요.
#   ./reversproxy-client --config config.yaml
# 배선(토폴로지) 설명은 FILE_TRANSFER.md 를 참고하세요.
#
# 이 예시는 두 거점을 가정합니다:
#   site-a = 이 클라이언트(NAT 뒤, 서버가 이쪽으로 접속)
#   site-b = 공인 IP 서버
# =============================================================================

# 서버가 이 클라이언트로 접속(dial)해 오는 리슨 주소.
listen_addr: "0.0.0.0:8443"

# 서버와 공유하는 사전 인증 토큰. 서버 clients[].auth_token 과 동일해야 합니다.
# 비우거나 "changeme" 이면 (insecure:false 일 때) 시작이 거부됩니다.
auth_token: "CHANGE-ME-strong-shared-token"

# 이 클라이언트의 이름. 서버 clients[].name 과 일치해야 매칭됩니다.
name: "site-a"

# 운영에서는 false 로 두고 정상 인증서를 사용하세요. 자체 서명 테스트만 true.
insecure: false

log_level: "info"

# 클라이언트 리스너의 TLS 인증서/키 (자체 서명이라도 필요).
cert_path: "client.crt"
key_path:  "client.key"

# -----------------------------------------------------------------------------
# 터널: (서버 → 클라이언트 전송용) 이 클라이언트의 파일 수신기(8089)를
#        서버의 공개 포트 18089 로 노출합니다.
#        local_port 는 반드시 file_transfer.receive_addr 의 포트와 같아야 합니다.
# -----------------------------------------------------------------------------
tunnels:
  - type: tcp
    local_host: "127.0.0.1"
    local_port: 8089            # == file_transfer.receive_addr 포트
    requested_port: 18089       # 서버 쪽 공개 포트 (서버 send_endpoint 가 여기로 보냄)

# -----------------------------------------------------------------------------
# 포트 포워드: (클라이언트 → 서버 전송용) 서버의 파일 수신기(127.0.0.1:8089)에
#              닿는 로컬 포트 8090 을 엽니다. file_transfer.send_endpoint 가 여기로 보냅니다.
# -----------------------------------------------------------------------------
port_forwards:
  - local_port: 8090
    remote_host: "127.0.0.1"    # 서버 입장에서의 자기 자신(= 서버 수신기 호스트)
    remote_port: 8089           # 서버 file_transfer.receive_addr 포트
    bind: "127.0.0.1"

# -----------------------------------------------------------------------------
# 파일 전송
#   enabled:true 이면 수신기가 자동으로 뜹니다(받은 파일은 drop_dir 에 저장).
#   token 은 양쪽(클라이언트/서버)이 동일해야 하며, 업로드 인증에 쓰입니다.
# -----------------------------------------------------------------------------
file_transfer:
  enabled: true
  receive_addr: "127.0.0.1:8089"          # 수신 HTTP 엔드포인트(루프백 바인딩, 터널로만 노출)
  drop_dir: "received"                     # 받은 파일 저장 폴더(상대경로는 실행 위치 기준)
  token: "CHANGE-ME-shared-ft-secret"      # 양쪽 동일. 비우면 업로드 인증 없음(신뢰망만)
  send_endpoint: "http://127.0.0.1:8090"   # 보낼 대상 = 위 port_forward 로 열린 서버 수신기
  control_addr: "127.0.0.1:8077"           # 윈도우 우클릭 헬퍼용 로컬 IPC (Windows 전용)
  max_file_size: 0                         # 0 = 무제한 (byte 단위)
